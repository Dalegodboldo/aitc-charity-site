name: roundup-diagnose
on:
  push:
    branches: [tmp/roundup-diagnose]
permissions:
  contents: read
  deployments: read
  statuses: read
jobs:
  live:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          R=${{ github.repository }}
          for i in $(seq 1 40); do
            s=$(gh api "repos/$R/commits/3a19781/status" --jq '[.statuses[]|select(.context=="Vercel")][0].state' 2>/dev/null)
            echo "vercel status: $s"; [ "$s" = success ] && break; [ "$s" = failure ] && break; sleep 15
          done
          sleep 20
          curl -sSL "https://alwaysintheclub.org/api/roundup-proxy/october?x=$RANDOM" -o p.html
          echo "BASE TAG: $(grep -c '<base target="_blank">' p.html)  _self: $(grep -o 'target="_self"' p.html | wc -l)"
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const ctx = await b.newContext({viewport:{width:1280,height:900}});
          const p = await ctx.newPage();
          await p.goto('https://alwaysintheclub.org/mouseketeer-roundup?x='+Date.now(),{waitUntil:'networkidle'});
          await p.getByRole('button',{name:/October 2026/}).click();
          const fr = p.frameLocator('iframe[title*="October"]');
          for (const t of ['trailer here','recap reel','our blog post here.','YouTube link here.','Super Dad contest','WATCH EPISODE ON YOUTUBE','Shop the Club']) {
            const link = fr.getByText(t,{exact:true}).first();
            try { await link.waitFor({timeout:20000}); } catch { console.log(t,'-> NOT FOUND'); continue; }
            const pop = ctx.waitForEvent('page',{timeout:8000}).catch(()=>null);
            await link.click(); const w = await pop; await p.waitForTimeout(1500);
            const inFrame = p.frames()[1]?.url() || '';
            console.log(`${t} -> new tab: ${w ? w.url() : 'NONE'} | popup frame: ${inFrame.includes('roundup-proxy') ? 'still newsletter' : inFrame}`);
            if (w) await w.close();
          }
          await b.close();
          JS
          node t.mjs
