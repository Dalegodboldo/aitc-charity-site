name: roundup-diagnose
on:
  push:
    branches: [tmp/roundup-diagnose]
permissions:
  contents: read
  deployments: read
  statuses: read
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          R=${{ github.repository }}
          for c in 375fd9f c477a47 39b3f93 4172e75 26ec2d7; do
            echo "== $c"; gh api "repos/$R/commits/$c/status" --jq '.statuses[] | "\(.context) \(.state) \(.description) \(.target_url)"' || true
            gh api "repos/$R/commits/$c/check-runs" --jq '.check_runs[] | "check \(.name) \(.status) \(.conclusion) \(.output.title)"' || true
          done
          echo "== deployments"; gh api "repos/$R/deployments?per_page=8" --jq '.[] | "\(.sha[0:7]) \(.environment) \(.created_at) id=\(.id)"' || true
          for id in $(gh api "repos/$R/deployments?per_page=8" --jq '.[].id'); do echo "-- $id: $(gh api repos/$R/deployments/$id/statuses --jq '.[0] | "\(.state) \(.description)"')"; done
          echo "== live asset check"; curl -s -o /dev/null -w "MR-october.jpg %{http_code}\n" https://alwaysintheclub.org/images/MR-october.jpg
